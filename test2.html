<!DOCTYPE html>
<html>
<head>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = { darkMode: 'class', theme: { extend: { colors: { myred: '#ff0000' } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="bg-myred text-white">Should be red</div>
    <div class="dark:bg-black bg-white">Should be white (not black, since html lacks .dark)</div>
</body>
</html>
