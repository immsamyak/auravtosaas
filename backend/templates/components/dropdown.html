{# Usage Example for {% dropdown %} is in the Walkthrough artifact #}
<div class="relative" x-data="{ open: false }" @click.stop>
    <button @click="open = !open" @click.away="open = false" type="button" class="text-slate-400 hover:text-slate-900 transition-colors p-2 rounded-lg hover:bg-slate-100 focus:outline-none">
        <i class="fa-solid fa-ellipsis-vertical w-4 text-center"></i>
    </button>
    <div x-show="open" x-transition class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50" x-cloak>
        {{ dropdown_content|safe }}
    </div>
</div>
