<div class="group bg-theme-bg-surface rounded-2xl p-6 border border-theme-border-base shadow-sm hover:shadow-xl hover:shadow-slate-200/60 hover:-translate-y-1 hover:border-slate-300 dark:hover:border-slate-600/50 transition-all duration-300 ease-out {% if classes %}{{ classes }}{% endif %} flex flex-col relative overflow-hidden">
 <!-- Optional top accent line -->
 <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-slate-200 group-hover:via-indigo-400 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

 <div class="flex items-start justify-between mb-6">
 <!-- Icon container with premium styling -->
 <div class="w-12 h-12 rounded-xl bg-theme-bg-base group-hover:bg-indigo-50 border border-theme-border-divider group-hover:border-indigo-100 flex items-center justify-center transition-colors duration-300">
 <i class="fa-solid fa-{{ icon|default:'chart-simple' }} text-lg text-slate-400 dark:text-slate-500 group-hover:text-indigo-600 group-hover:scale-110 transition-transform duration-300"></i>
 </div>
 
 {% if trend %}
 <!-- Pill-shaped trend indicator -->
 <div class="flex items-center space-x-1.5 text-xs font-bold px-2.5 py-1 rounded-full {% if trend == 'up' %}bg-emerald-50 text-emerald-700{% elif trend == 'down' %}bg-rose-50 text-rose-700{% else %}bg-slate-50 text-slate-600{% endif %}">
 {% if trend == 'up' %}
 <i class="fa-solid fa-arrow-trend-up text-[10px]"></i>
 {% elif trend == 'down' %}
 <i class="fa-solid fa-arrow-trend-down text-[10px]"></i>
 {% else %}
 <i class="fa-solid fa-minus text-[10px]"></i>
 {% endif %}
 {% if trend_value %}<span>{{ trend_value }}</span>{% endif %}
 </div>
 {% endif %}
 </div>
 
 <div class="flex-1">
 <h3 class="text-sm font-semibold text-theme-text-muted mb-1 tracking-tight">{{ title }}</h3>
 <p class="text-3xl font-extrabold text-theme-text-base tracking-tight">{{ value }}</p>
 </div>
 
 {% if footer %}
 <div class="mt-5 pt-4 border-t border-slate-100/80">
 <p class="text-xs font-medium text-slate-400 dark:text-slate-500 flex items-center">
 <i class="fa-regular fa-clock mr-1.5 text-slate-300 dark:text-slate-600"></i> {{ footer }}
 </p>
 </div>
 {% endif %}
</div>
