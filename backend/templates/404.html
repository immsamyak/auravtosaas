{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Aura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="antialiased text-slate-900 bg-white min-h-screen flex flex-col">
    
    <!-- Simple Navbar -->
    <nav class="border-b border-slate-100 py-6">
        <div class="max-w-7xl mx-auto px-6">
            <a href="/" class="text-2xl font-bold tracking-tight text-slate-900 flex items-center">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-2 shadow-md shadow-indigo-200">
                    <span class="text-white text-lg font-bold">A</span>
                </div>
                Aura
            </a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="text-center max-w-lg mx-auto">
            <div class="text-indigo-600 font-extrabold text-9xl tracking-tighter mb-4 drop-shadow-sm">404</div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 mb-4">Page not found</h1>
            <p class="text-slate-500 text-lg leading-relaxed mb-10">
                Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or perhaps the URL is incorrect.
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="javascript:history.back()" class="w-full sm:w-auto bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-slate-900 font-semibold py-3 px-8 rounded-xl transition-all shadow-sm">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Go Back
                </a>
                <a href="/" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5">
                    Return Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
