{% extends "base.html" %}

{% block title %}{{ page.title }} | Aura Virtual Try-On{% endblock %}

{% block content %}
<div class="bg-white min-h-screen pt-32 pb-20">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-12">
            <a href="{% url 'index' %}" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm flex items-center mb-6">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Home
            </a>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">{{ page.title }}</h1>
            <p class="text-slate-500 mt-4 text-sm">Last updated: {{ page.updated_at|date:"F j, Y" }}</p>
        </div>
        
        <div class="prose prose-slate prose-lg max-w-none">
            {{ page.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
