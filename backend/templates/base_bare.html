{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Aura Try-On</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="{% static 'js/tailwind_config_v2.js' %}?v=2.0"></script>
 <link rel="stylesheet" href="{% static 'css/app.css' %}?v=2.0">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Toastify Setup -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
  window.showToast = function(msg, type='info') {
    let bgColor = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#333');
    Toastify({
      text: msg,
      duration: 3000,
      gravity: "bottom",
      position: "right",
      style: {
        background: bgColor,
        borderRadius: '8px',
        boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
        padding: '12px 24px',
        fontSize: '14px',
        fontWeight: '500'
      }
    }).showToast();
  };
</script>
</head>

<body class="bg-theme-surface text-theme-text-primary antialiased min-h-screen flex flex-col">
 <main class="flex-grow">
 {% block content %}{% endblock %}
 </main>
 <script src="{% static 'js/app.js' %}?v=2.0"></script>
</body>
</html>
