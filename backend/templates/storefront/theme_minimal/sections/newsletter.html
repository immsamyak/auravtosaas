<div class="w-full py-20 bg-white text-gray-900" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans font-medium tracking-tight text-black">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans text-gray-500">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="border-b border-stone-300 flex pb-2 max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="outline-none w-full bg-transparent text-stone-800 placeholder-stone-400">
 <button type="submit" class="uppercase tracking-[0.1em] text-xs hover:text-stone-400 transition-colors">Join</button>
 </form>
 </div>
</div>
