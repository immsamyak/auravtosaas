<div class="w-full py-20 bg-teal-50 text-teal-900" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-serif text-teal-800 uppercase tracking-widest">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-light text-teal-700">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex border border-sky-200/20 rounded-full overflow-hidden max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="w-full px-5 py-3 bg-transparent outline-none text-white placeholder-sky-200/30 font-sans text-sm">
 <button type="submit" class="bg-resort-gold text-white px-6 font-sans font-semibold text-sm hover:bg-resort-ocean transition-colors">Join</button>
 </form>
 </div>
</div>
