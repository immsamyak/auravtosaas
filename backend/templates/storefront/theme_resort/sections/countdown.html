<div class="w-full py-20 bg-teal-50 text-teal-900" 
    x-data="{ 
        endDate: {% if settings.target_date %}new Date('{{ settings.target_date }}').getTime(){% else %}new Date(new Date().getTime() + 14 * 24 * 60 * 60 * 1000).getTime(){% endif %}, 
        days: 0, hours: 0, mins: 0, secs: 0,
        init() { this.update(); setInterval(() => this.update(), 1000); },
        update() {
            let distance = this.endDate - new Date().getTime();
            if (distance < 0) { this.days = 0; this.hours = 0; this.mins = 0; this.secs = 0; return; }
            this.days = Math.floor(distance / (1000 * 60 * 60 * 24));
            this.hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            this.mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            this.secs = Math.floor((distance % (1000 * 60)) / 1000);
        }
    }">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-4xl md:text-6xl font-serif text-teal-800 uppercase tracking-widest mb-6">{{ settings.heading|default:'Flash Sale' }}</h2>
        <p class="text-xl md:text-2xl font-sans font-light text-teal-700 mb-16">{{ settings.subheading|default:'Ends soon.' }}</p>
        
        <div class="flex items-center justify-center gap-6 md:gap-12">
            <div class="border border-teal-200 bg-white rounded-3xl shadow-lg shadow-teal-100 p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-teal-800 uppercase tracking-widest text-inherit mb-2" x-text="days < 10 ? '0' + days : days">14</div>
                <div class="font-sans font-light text-teal-700 uppercase tracking-widest text-inherit opacity-70">Days</div>
            </div>
            <div class="text-4xl md:text-6xl font-serif text-teal-800 uppercase tracking-widest text-inherit opacity-50">:</div>
            <div class="border border-teal-200 bg-white rounded-3xl shadow-lg shadow-teal-100 p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-teal-800 uppercase tracking-widest text-inherit mb-2" x-text="hours < 10 ? '0' + hours : hours">08</div>
                <div class="font-sans font-light text-teal-700 uppercase tracking-widest text-inherit opacity-70">Hours</div>
            </div>
            <div class="text-4xl md:text-6xl font-serif text-teal-800 uppercase tracking-widest text-inherit opacity-50">:</div>
            <div class="border border-teal-200 bg-white rounded-3xl shadow-lg shadow-teal-100 p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-teal-800 uppercase tracking-widest text-inherit mb-2" x-text="mins < 10 ? '0' + mins : mins">45</div>
                <div class="font-sans font-light text-teal-700 uppercase tracking-widest text-inherit opacity-70">Mins</div>
            </div>
        </div>
    </div>
</div>
