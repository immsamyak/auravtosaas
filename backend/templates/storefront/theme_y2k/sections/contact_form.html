<div class="w-full py-20 bg-fuchsia-100 text-fuchsia-900">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899]">{{ settings.heading|default:'Contact Us' }}</h2>
            <p class="mt-4 text-xl font-sans font-bold text-fuchsia-700">{{ settings.subheading|default:'We would love to hear from you.' }}</p>
        </div>
        <form class="space-y-6 border-4 border-pink-500 bg-white rounded-full shadow-[6px_6px_0px_0px_rgba(236,72,153,1)] p-8 md:p-12" 
              x-data="{ isSubmitting: false }" 
              @submit.prevent="
                isSubmitting = true; 
                fetch('{% url 'contact_submit' brand.slug %}', {
                    method: 'POST',
                    body: new FormData($el),
                    headers: {'X-CSRFToken': '{{ csrf_token }}'}
                })
                .then(response => response.json())
                .then(data => {
                    isSubmitting = false;
                    if (data.success) {
                        $el.reset();
                        window.showToast(data.message || 'Message sent successfully!', 'success');
                    } else {
                        window.showToast(data.message || 'An error occurred.', 'error');
                    }
                })
                .catch(error => {
                    isSubmitting = false;
                    window.showToast('Failed to send message.', 'error');
                })
              ">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block mb-2 font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899] text-inherit">First Name</label>
                    <input required type="text" name="first_name" class="w-full bg-transparent border-4 border-pink-500 bg-white rounded-full p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans font-bold text-fuchsia-700 text-inherit">
                </div>
                <div>
                    <label class="block mb-2 font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899] text-inherit">Last Name</label>
                    <input required type="text" name="last_name" class="w-full bg-transparent border-4 border-pink-500 bg-white rounded-full p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans font-bold text-fuchsia-700 text-inherit">
                </div>
            </div>
            <div>
                <label class="block mb-2 font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899] text-inherit">Email Address</label>
                <input required type="email" name="email" class="w-full bg-transparent border-4 border-pink-500 bg-white rounded-full p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans font-bold text-fuchsia-700 text-inherit">
            </div>
            <div>
                <label class="block mb-2 font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899] text-inherit">Message</label>
                <textarea required rows="5" name="message" class="w-full bg-transparent border-4 border-pink-500 bg-white rounded-full p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans font-bold text-fuchsia-700 text-inherit"></textarea>
            </div>
            <div class="pt-4">
                <button type="submit" :disabled="isSubmitting" class="w-full flex justify-center bg-gradient-to-r from-pink-500 to-blue-500 text-white hover:from-pink-400 hover:to-blue-400 rounded-full font-black uppercase px-8 py-4 rounded-full transition-all disabled:opacity-70">
                    <span x-show="!isSubmitting">Send Message</span>
                    <span x-show="isSubmitting" x-cloak><i class="fa-solid fa-circle-notch fa-spin"></i> Sending...</span>
                </button>
            </div>
        </form>
    </div>
</div>
