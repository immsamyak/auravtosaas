<div class="w-full py-20 bg-fuchsia-100 text-fuchsia-900" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans font-black text-blue-500 drop-shadow-[2px_2px_0px_#ec4899]">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-bold text-fuchsia-700">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex max-w-sm y2k-border overflow-hidden bg-theme-surface max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="w-full px-4 py-3 outline-none bg-transparent text-theme-text-secondary placeholder-y2k-pink/50 font-medium">
 <button type="submit" class="bg-y2k-hotpink text-white px-6 font-bold hover:bg-y2k-lilac transition-colors">Join ✧</button>
 </form>
 </div>
</div>
