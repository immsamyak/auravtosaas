<div class="w-full py-20 bg-[#FDFBF7] text-[#5C4A3D]" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-serif italic text-[#8B5A2B]">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans text-[#7A6B5D]">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex max-w-sm border border-boho-clay/30 rounded-full overflow-hidden bg-theme-surface max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="w-full px-5 py-3 outline-none bg-transparent text-boho-walnut placeholder-boho-clay/40 font-sans">
 <button type="submit" class="bg-boho-terra text-white px-6 font-sans font-bold text-sm hover:bg-boho-olive transition-colors">Join</button>
 </form>
 </div>
</div>
