<div class="w-full py-16" style="background-color: {{ settings.bgColor|default:'#ffffff' }};">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
            <h2 class="text-2xl font-semibold text-gray-600 uppercase tracking-wide">{{ settings.heading|default:'As Seen On' }}</h2>
            {% if settings.subheading %}<p class="mt-2 text-gray-500">{{ settings.subheading }}</p>{% endif %}
        </div>
        <div class="flex flex-wrap justify-center gap-12 opacity-50 grayscale hover:grayscale-0 transition-all duration-500">
            {% if settings.logos %}
                {% for logo in settings.logos %}
                    {% if logo.image_url %}
                        <img src="{{ logo.image_url }}" alt="Brand Logo" class="h-12 md:h-16 w-auto object-contain hover:scale-110 transition-transform mix-blend-multiply">
                    {% endif %}
                {% endfor %}
            {% else %}
            <i class="fa-brands fa-vogue text-5xl"></i>
            <i class="fa-brands fa-etsy text-5xl"></i>
            <i class="fa-brands fa-amazon text-5xl"></i>
            <i class="fa-brands fa-shopify text-5xl"></i>
            <i class="fa-brands fa-pinterest text-5xl"></i>
            {% endif %}
        </div>
    </div>
</div>
