<div class="w-full py-20 bg-gray-100 text-gray-900" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans font-black italic text-black">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-medium text-gray-700">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex border border-white/10 rounded-lg overflow-hidden max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="w-full px-4 py-3 bg-transparent outline-none text-white placeholder-gray-600 font-sans text-sm">
 <button type="submit" class="bg-snkr-red text-white px-6 font-sans font-bold text-sm hover:bg-snkr-ember transition-colors">Alert Me</button>
 </form>
 </div>
</div>
