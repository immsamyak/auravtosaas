<section class="py-16 px-4 md:px-8 w-full" style="background-color: {{ settings.bgColor|default:'transparent' }};">
    <div>
<h4 class="font-sans font-bold text-sm uppercase mb-4">{{ settings.heading|default:'Get Drop Alerts' }}</h4>
<form action="{% url 'newsletter_subscribe' brand.slug %}" class="flex border border-white/10 rounded-lg overflow-hidden" id="newsletter-subscribe-form" method="POST">
<input class="w-full px-4 py-3 bg-transparent outline-none text-white placeholder-gray-600 font-sans text-sm" name="email" placeholder="Email" type="email"/>
<button class="bg-snkr-red text-white px-6 font-sans font-bold text-sm hover:bg-snkr-ember transition-colors" type="submit">Alert Me</button>
</form>
</div>
</section>
