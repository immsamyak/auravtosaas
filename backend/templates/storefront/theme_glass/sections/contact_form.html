<div class="w-full py-20 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-sans font-bold text-white drop-shadow-md">{{ settings.heading|default:'Contact Us' }}</h2>
            <p class="mt-4 text-xl font-sans text-white/90">{{ settings.subheading|default:'We would love to hear from you.' }}</p>
        </div>
        <form class="space-y-6 border border-white/20 backdrop-blur-lg bg-white/10 rounded-3xl shadow-[0_8px_32px_rgba(0,0,0,0.1)] p-8 md:p-12" 
              x-data="{ isSubmitting: false }" 
              @submit.prevent="
                isSubmitting = true; 
                fetch('{% url 'contact_submit' brand.slug %}', {
                    method: 'POST',
                    body: new FormData($el),
                    headers: {'X-CSRFToken': '{{ csrf_token }}'}
                })
                .then(response => response.json())
                .then(data => {
                    isSubmitting = false;
                    if (data.success) {
                        $el.reset();
                        window.showToast(data.message || 'Message sent successfully!', 'success');
                    } else {
                        window.showToast(data.message || 'An error occurred.', 'error');
                    }
                })
                .catch(error => {
                    isSubmitting = false;
                    window.showToast('Failed to send message.', 'error');
                })
              ">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block mb-2 font-sans font-bold text-white drop-shadow-md text-inherit">First Name</label>
                    <input required type="text" name="first_name" class="w-full bg-transparent border border-white/20 backdrop-blur-lg bg-white/10 rounded-3xl p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans text-white/90 text-inherit">
                </div>
                <div>
                    <label class="block mb-2 font-sans font-bold text-white drop-shadow-md text-inherit">Last Name</label>
                    <input required type="text" name="last_name" class="w-full bg-transparent border border-white/20 backdrop-blur-lg bg-white/10 rounded-3xl p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans text-white/90 text-inherit">
                </div>
            </div>
            <div>
                <label class="block mb-2 font-sans font-bold text-white drop-shadow-md text-inherit">Email Address</label>
                <input required type="email" name="email" class="w-full bg-transparent border border-white/20 backdrop-blur-lg bg-white/10 rounded-3xl p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans text-white/90 text-inherit">
            </div>
            <div>
                <label class="block mb-2 font-sans font-bold text-white drop-shadow-md text-inherit">Message</label>
                <textarea required rows="5" name="message" class="w-full bg-transparent border border-white/20 backdrop-blur-lg bg-white/10 rounded-3xl p-4 focus:outline-none focus:ring-2 focus:ring-current font-sans text-white/90 text-inherit"></textarea>
            </div>
            <div class="pt-4">
                <button type="submit" :disabled="isSubmitting" class="w-full flex justify-center bg-white/20 backdrop-blur-md border border-white/30 text-white hover:bg-white/30 rounded-2xl px-8 py-4 rounded-3xl transition-all disabled:opacity-70">
                    <span x-show="!isSubmitting">Send Message</span>
                    <span x-show="isSubmitting" x-cloak><i class="fa-solid fa-circle-notch fa-spin"></i> Sending...</span>
                </button>
            </div>
        </form>
    </div>
</div>
