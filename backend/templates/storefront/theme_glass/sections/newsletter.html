<div class="w-full py-20 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans font-bold text-white drop-shadow-md">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans text-white/90">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex glass rounded-xl overflow-hidden max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="w-full px-4 py-3 bg-transparent outline-none text-white placeholder-white/30 text-sm">
 <button type="submit" class="bg-gradient-to-r from-indigo-500 to-pink-500 px-6 text-white font-semibold text-sm hover:opacity-80 transition-opacity">Join</button>
 </form>
 </div>
</div>
