<div class="w-full py-20 bg-zinc-900 text-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-sans uppercase font-black text-lime-400 italic">{{ settings.heading|default:'FAQ' }}</h2>
            <p class="mt-4 text-xl font-sans text-gray-300">{{ settings.subheading|default:'Find answers.' }}</p>
        </div>
        <div class="space-y-4" x-data="{ activeIndex: null }">
            <div class="border-2 border-lime-400/30 bg-zinc-800 rounded-sm shadow-[0_4px_20px_rgba(163,230,53,0.2)] overflow-hidden">
                <button @click="activeIndex = activeIndex === 0 ? null : 0" class="w-full text-left px-8 py-6 flex justify-between items-center focus:outline-none">
                    <h3 class="text-xl font-sans uppercase font-black text-lime-400 italic text-inherit">What is your return policy?</h3>
                    <i class="fa-solid fa-chevron-down transition-transform duration-300 text-lime-400" :class="activeIndex === 0 ? 'rotate-180' : ''"></i>
                </button>
                <div x-show="activeIndex === 0" x-collapse x-transition class="px-8 pb-6">
                    <p class="font-sans text-gray-300">We offer a 30-day return policy for all unworn items with original tags attached.</p>
                </div>
            </div>
            <div class="border-2 border-lime-400/30 bg-zinc-800 rounded-sm shadow-[0_4px_20px_rgba(163,230,53,0.2)] overflow-hidden">
                <button @click="activeIndex = activeIndex === 1 ? null : 1" class="w-full text-left px-8 py-6 flex justify-between items-center focus:outline-none">
                    <h3 class="text-xl font-sans uppercase font-black text-lime-400 italic text-inherit">Do you ship internationally?</h3>
                    <i class="fa-solid fa-chevron-down transition-transform duration-300 text-lime-400" :class="activeIndex === 1 ? 'rotate-180' : ''"></i>
                </button>
                <div x-show="activeIndex === 1" x-collapse x-transition class="px-8 pb-6">
                    <p class="font-sans text-gray-300">Yes, we ship to over 100 countries worldwide. Shipping costs are calculated at checkout.</p>
                </div>
            </div>
        </div>
    </div>
</div>
