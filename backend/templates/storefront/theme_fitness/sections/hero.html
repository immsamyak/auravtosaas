<section class="bg-black text-white relative border-b-[10px] border-yellow-500 overflow-hidden min-h-[50vh]">
 <div class="absolute inset-0 w-full h-full">
 {% if brand.banner %}
 <img src="{% if settings.image_url %}{{ settings.image_url }}{% else %}{{ brand.banner.url }}{% endif %}" alt="{{ brand.name }} Banner" class="w-full h-full object-cover opacity-60">
 {% else %}
 <div class="w-full h-full flex items-center justify-center bg-gray-900">
 <span class="text-theme-text-secondary font-display text-4xl font-bold tracking-widest">{{ brand.name }}</span>
 </div>
 {% endif %}
 </div>
 
 <!-- Diagonal background element -->
 <div class="absolute right-0 top-0 bottom-0 w-1/3 bg-yellow-500 skew-x-[25deg] origin-bottom-right hidden md:block opacity-90"></div>
</section>
