<section class="bg-slate-900 border-b border-blue-600 relative overflow-hidden h-[50vh]">
 <!-- Grid overlay -->
 <div class="absolute inset-0" style="background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px); background-size: 40px 40px; opacity: 0.5;"></div>
 
 <div class="absolute inset-0 z-10">
 {% if brand.banner %}
 <img src="{% if settings.image_url %}{{ settings.image_url }}{% else %}{{ brand.banner.url }}{% endif %}" alt="{{ brand.name }} Banner" class="w-full h-full object-cover opacity-80">
 {% else %}
 <div class="w-full h-full flex items-center justify-center">
 <span class="text-theme-text-muted font-mono text-2xl tracking-widest uppercase">{{ brand.name }}</span>
 </div>
 {% endif %}
 </div>
</section>
