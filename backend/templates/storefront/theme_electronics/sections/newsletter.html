<section class="py-16 px-4 md:px-8 w-full" style="background-color: {{ settings.bgColor|default:'transparent' }};">
    <div class="max-w-7xl mx-auto px-6 pb-8">
<div class="text-center mb-6">
<h4 class="text-sm font-bold uppercase tracking-wider text-white mb-2">{{ settings.heading|default:'Newsletter' }}</h4>
<p class="text-theme-text-muted text-sm">Get the latest in tech and exclusive deals.</p>
</div>
<form action="{% url 'newsletter_subscribe' brand.slug %}" class="flex max-w-md mx-auto border border-blue-500/30 rounded-lg overflow-hidden" id="newsletter-subscribe-form" method="POST">
<input class="flex-1 px-4 py-3 bg-transparent outline-none text-white text-sm placeholder-gray-500" name="email" placeholder="Enter your email" required="" type="email"/>
<button class="px-6 py-3 bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 transition-colors" type="submit">Subscribe</button>
</form>
</div>
</section>
