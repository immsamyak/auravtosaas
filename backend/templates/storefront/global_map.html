<div class="w-full py-16" style="background-color: {{ settings.bgColor|default:'#f3f4f6' }};">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">{{ settings.heading|default:'Visit Our Store' }}</h2>
            <p class="mt-4 text-lg text-gray-500">{{ settings.subheading|default:'123 Fashion Ave, New York, NY 10001' }}</p>
        </div>
        <div class="w-full h-96 bg-gray-200 rounded-xl overflow-hidden relative border border-gray-300">
            <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                <i class="fa-solid fa-map-location-dot text-6xl mb-4"></i>
                <span class="text-lg font-medium">Interactive Map Placeholder</span>

        </div>
