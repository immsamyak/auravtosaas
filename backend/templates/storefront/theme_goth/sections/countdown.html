<div class="w-full py-20 bg-[#0a0a0a] text-gray-300" 
    x-data="{ 
        endDate: new Date(new Date().getTime() + 14 * 24 * 60 * 60 * 1000).getTime(), 
        days: 0, hours: 0, mins: 0, 
        init() { this.update(); setInterval(() => this.update(), 60000); },
        update() {
            let distance = this.endDate - new Date().getTime();
            if (distance < 0) { this.days = 0; this.hours = 0; this.mins = 0; return; }
            this.days = Math.floor(distance / (1000 * 60 * 60 * 24));
            this.hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            this.mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        }
    }">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-4xl md:text-6xl font-serif text-red-700 italic mb-6">{{ settings.heading|default:'Flash Sale' }}</h2>
        <p class="text-xl md:text-2xl font-sans text-gray-400 mb-16">{{ settings.subheading|default:'Ends soon.' }}</p>
        
        <div class="flex items-center justify-center gap-6 md:gap-12">
            <div class="border border-red-900/50 bg-black rounded-none shadow-[0_0_20px_rgba(185,28,28,0.15)] p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-red-700 italic text-inherit mb-2" x-text="days < 10 ? '0' + days : days">14</div>
                <div class="font-sans text-gray-400 uppercase tracking-widest text-inherit opacity-70">Days</div>
            </div>
            <div class="text-4xl md:text-6xl font-serif text-red-700 italic text-inherit opacity-50">:</div>
            <div class="border border-red-900/50 bg-black rounded-none shadow-[0_0_20px_rgba(185,28,28,0.15)] p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-red-700 italic text-inherit mb-2" x-text="hours < 10 ? '0' + hours : hours">08</div>
                <div class="font-sans text-gray-400 uppercase tracking-widest text-inherit opacity-70">Hours</div>
            </div>
            <div class="text-4xl md:text-6xl font-serif text-red-700 italic text-inherit opacity-50">:</div>
            <div class="border border-red-900/50 bg-black rounded-none shadow-[0_0_20px_rgba(185,28,28,0.15)] p-6 md:p-10 min-w-[100px] md:min-w-[160px]">
                <div class="text-5xl md:text-7xl font-serif text-red-700 italic text-inherit mb-2" x-text="mins < 10 ? '0' + mins : mins">45</div>
                <div class="font-sans text-gray-400 uppercase tracking-widest text-inherit opacity-70">Mins</div>
            </div>
        </div>
    </div>
</div>
