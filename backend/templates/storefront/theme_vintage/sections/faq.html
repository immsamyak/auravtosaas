<div class="w-full py-20 bg-[#F5F5DC] text-[#4A4A4A]">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-serif text-[#8B4513]">{{ settings.heading|default:'FAQ' }}</h2>
            <p class="mt-4 text-xl font-serif text-[#696969]">{{ settings.subheading|default:'Find answers.' }}</p>
        </div>
        <div class="space-y-4" x-data="{ activeIndex: null }">
            <div class="border-2 border-[#D2B48C] border-double bg-[#FFF8DC] rounded-sm shadow-md shadow-[#D2B48C]/50 overflow-hidden">
                <button @click="activeIndex = activeIndex === 0 ? null : 0" class="w-full text-left px-8 py-6 flex justify-between items-center focus:outline-none">
                    <h3 class="text-xl font-serif text-[#8B4513] text-inherit">What is your return policy?</h3>
                    <i class="fa-solid fa-chevron-down transition-transform duration-300 text-[#D2691E]" :class="activeIndex === 0 ? 'rotate-180' : ''"></i>
                </button>
                <div x-show="activeIndex === 0" x-collapse x-transition class="px-8 pb-6">
                    <p class="font-serif text-[#696969]">We offer a 30-day return policy for all unworn items with original tags attached.</p>
                </div>
            </div>
            <div class="border-2 border-[#D2B48C] border-double bg-[#FFF8DC] rounded-sm shadow-md shadow-[#D2B48C]/50 overflow-hidden">
                <button @click="activeIndex = activeIndex === 1 ? null : 1" class="w-full text-left px-8 py-6 flex justify-between items-center focus:outline-none">
                    <h3 class="text-xl font-serif text-[#8B4513] text-inherit">Do you ship internationally?</h3>
                    <i class="fa-solid fa-chevron-down transition-transform duration-300 text-[#D2691E]" :class="activeIndex === 1 ? 'rotate-180' : ''"></i>
                </button>
                <div x-show="activeIndex === 1" x-collapse x-transition class="px-8 pb-6">
                    <p class="font-serif text-[#696969]">Yes, we ship to over 100 countries worldwide. Shipping costs are calculated at checkout.</p>
                </div>
            </div>
        </div>
    </div>
</div>
