<div class="w-full py-20 bg-white text-black" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-serif font-normal uppercase tracking-[0.3em] text-black">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-light text-gray-500">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex border-b border-white/30 pb-2 max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="bg-transparent w-full text-white outline-none placeholder-gray-600 text-sm">
 <button type="submit" class="text-white hover:text-[#c5a059] uppercase tracking-widest text-[10px] font-bold">Subscribe</button>
 </form>
 </div>
</div>
