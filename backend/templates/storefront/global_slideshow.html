<div class="relative w-full h-[600px] md:h-[800px] bg-gray-900 overflow-hidden" 
    style="background-color: {{ settings.bgColor|default:'#111827' }};"
    x-data="{ 
        activeSlide: 0,
        slides: [
            'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1920&q=80',
            'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1920&q=80',
            'https://images.unsplash.com/photo-1434389678278-be43e498c218?w=1920&q=80'
        ],
        init() {
            setInterval(() => { this.activeSlide = (this.activeSlide + 1) % this.slides.length; }, 5000);
        }
    }">
    <template x-for="(slide, index) in slides" :key="index">
        <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out" 
             :class="activeSlide === index ? 'opacity-100 z-10' : 'opacity-0 z-0'">
            <img :src="slide" alt="Slideshow Background" class="w-full h-full object-cover opacity-70">
        </div>
    </template>

    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4 sm:px-6 lg:px-8 z-20 pointer-events-none">
        <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-6 drop-shadow-lg pointer-events-auto">{{ settings.heading|default:'New Collection Arrival' }}</h1>
        <p class="text-xl md:text-2xl text-gray-200 max-w-3xl mb-10 drop-shadow-md pointer-events-auto">{{ settings.subheading|default:'Discover the season\'s most anticipated styles.' }}</p>
        <div class="flex gap-4 pointer-events-auto">
            <a href=\"{% url 'storefront_shop' brand.slug %}\" class="px-8 py-4 bg-white text-black font-bold text-lg rounded hover:bg-gray-100 transition-colors">Shop Now</a>
            <a href=\"{% url 'storefront_categories' brand.slug %}\" class="px-8 py-4 bg-transparent border-2 border-white text-white font-bold text-lg rounded hover:bg-white/10 transition-colors">Explore</a>
        </div>
    </div>
    <div class="absolute bottom-8 left-0 right-0 flex justify-center gap-3 z-20">
        <template x-for="(slide, index) in slides" :key="index">
            <button @click="activeSlide = index" class="w-3 h-3 rounded-full transition-colors pointer-events-auto" :class="activeSlide === index ? 'bg-white' : 'bg-white/40 hover:bg-white/70'"></button>
        </template>
    </div>
</div>
