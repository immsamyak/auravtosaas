<section class="py-16 px-4 md:px-8 w-full" style="background-color: {{ settings.bgColor|default:'transparent' }};">
    <div class="max-w-7xl mx-auto px-6 pb-8">
<div class="text-center mb-6">
<h4 class="text-sm font-medium tracking-widest uppercase text-glow-charcoal mb-2">{{ settings.heading|default:'Stay Updated' }}</h4>
<p class="text-theme-text-disabled text-sm">Subscribe for exclusive offers and beauty tips.</p>
</div>
<form action="{% url 'newsletter_subscribe' brand.slug %}" class="flex max-w-md mx-auto border border-[#e8e4db] rounded-full overflow-hidden" id="newsletter-subscribe-form" method="POST">
<input class="flex-1 px-5 py-3 bg-transparent outline-none text-sm text-glow-charcoal placeholder-theme-placeholder" name="email" placeholder="Your email address" required="" type="email"/>
<button class="px-6 py-3 bg-glow-charcoal text-white text-sm font-medium hover:bg-glow-charcoal/80 transition-colors" type="submit">Subscribe</button>
</form>
</div>
</section>
