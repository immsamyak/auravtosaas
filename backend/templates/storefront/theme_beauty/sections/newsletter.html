<div class="w-full py-20 bg-rose-50 text-gray-800" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-serif italic text-rose-900">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-light text-gray-700">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex border border-[#e8e4db] rounded-full overflow-hidden max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="flex-1 px-5 py-3 bg-transparent outline-none text-sm text-glow-charcoal placeholder-theme-placeholder">
 <button type="submit" class="px-6 py-3 bg-glow-charcoal text-white text-sm font-medium hover:bg-glow-charcoal/80 transition-colors">Subscribe</button>
 </form>
 </div>
</div>
