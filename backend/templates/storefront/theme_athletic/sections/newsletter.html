<div class="w-full py-20 bg-gray-100 text-black" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans uppercase font-black tracking-tighter">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-bold">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex justify-center max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="px-4 py-2 border w-full text-black">
 <button type="submit" class="bg-black text-white px-6 py-2 font-bold">Join</button>
 </form>
 </div>
</div>
