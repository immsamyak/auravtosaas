<div class="w-full py-20 bg-zinc-100 text-zinc-900" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-sans font-black tracking-tighter uppercase">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans font-bold">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="bg-black text-white px-4 py-3 font-bold uppercase w-full outline-none brutal-border border-r-0">
 <button type="submit" class="bg-black text-neon px-6 py-3 font-bold uppercase brutal-border hover:bg-white hover:text-black transition-colors">Submit</button>
 </form>
 </div>
</div>
