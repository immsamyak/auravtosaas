<div class="w-full py-16" style="background-color: {{ settings.bgColor|default:'#000000' }};" x-data="{ videoOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-3xl font-bold text-white mb-4">{{ settings.heading|default:'Featured Video' }}</h2>
        <p class="mt-4 text-lg text-gray-300 mb-12">{{ settings.subheading|default:'Watch our latest campaign' }}</p>
        <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-gray-800 shadow-2xl ring-1 ring-white/10 group cursor-pointer" @click="videoOpen = true">
            <img src="https://images.unsplash.com/photo-1520975954732-57dd22299614?w=1280&q=80" class="w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-700">
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center group-hover:bg-white/30 transition-colors">
                    <i class="fa-solid fa-play text-3xl text-white ml-2"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div x-show="videoOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="relative w-full max-w-5xl aspect-video rounded-xl overflow-hidden bg-black shadow-2xl" @click.away="videoOpen = false">
            <button @click="videoOpen = false" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 w-10 h-10 bg-black/50 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <!-- Mock YouTube embed -->
            <div class="w-full h-full flex items-center justify-center text-white bg-gray-900 border-2 border-dashed border-gray-700">
                <div class="text-center py-24">
                    <i class="fa-brands fa-youtube text-6xl text-red-600 mb-4"></i>
                    <p class="text-xl">Embedded Video Player</p>
                </div>
            </div>
        </div>
    </div>
</div>
