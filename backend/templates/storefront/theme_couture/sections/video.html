{% load core_tags %}
<div class="w-full py-20 bg-black text-white" x-data="{ videoOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-4xl md:text-6xl font-serif uppercase tracking-widest text-white mb-6">{{ settings.heading|default:'Watch the Campaign' }}</h2>
        <p class="text-xl md:text-2xl font-sans font-light text-gray-300 mb-16">{{ settings.subheading|default:'Discover our story.' }}</p>
        <div class="relative w-full aspect-video rounded-none overflow-hidden shadow-2xl shadow-white/5 border border-white/20 bg-gray-900 group cursor-pointer" @click="videoOpen = true">
            <img src="{% if settings.cover_image %}{{ settings.cover_image }}{% else %}https://images.unsplash.com/photo-1520975954732-57dd22299614?w=1280&q=80{% endif %}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
            <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/40 transition-colors">
                <div class="w-24 h-24 bg-black text-white rounded-full flex items-center justify-center hover:scale-110 transition-transform">
                    <i class="fa-solid fa-play text-4xl ml-2 text-inherit"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div x-show="videoOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-md p-4" 
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="relative w-full max-w-6xl aspect-video rounded-none overflow-hidden bg-black shadow-2xl shadow-white/5" @click.away="videoOpen = false">
            <button @click="videoOpen = false" class="absolute top-6 right-6 text-white hover:text-gray-300 z-10 w-12 h-12 bg-black/60 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
            {% if settings.video_url %}
            <template x-if="videoOpen">
                <iframe class="w-full h-full" src="{{ settings.video_url|embed_url }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </template>
            {% else %}
            <div class="w-full h-full flex items-center justify-center text-white bg-gray-900 border-2 border-dashed border-gray-700">
                <div class="text-center py-24">
                    <i class="fa-brands fa-youtube text-7xl text-red-600 mb-6"></i>
                    <p class="text-2xl font-serif italic">Embedded Video Player</p>
                </div>
            </div>
            {% endif %}
            </div>
        </div>
    </div>
</div>
