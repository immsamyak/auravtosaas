<div class="w-full py-20 bg-stone-50 text-stone-800" style="background-color: {{ settings.bgColor|default:'transparent' }};">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
 <div class="text-center mb-12">
 <h2 class="text-4xl md:text-5xl font-serif text-stone-900">{{ settings.heading|default:'Subscribe to our Newsletter' }}</h2>
 <p class="mt-4 text-xl font-sans text-stone-600">{{ settings.subheading|default:'Get the latest updates and offers directly in your inbox.' }}</p>
 </div>
 <form action="{% url 'newsletter_subscribe' brand.slug %}" method="POST" id="newsletter-subscribe-form" class="flex border border-stone-300 rounded-full overflow-hidden max-w-md mx-auto w-full mt-8">
 {% csrf_token %}
 <input type="email" name="email" required placeholder="Your email address" class="flex-1 px-5 py-3 bg-transparent outline-none text-sm text-stone-800 placeholder-stone-400">
 <button type="submit" class="px-6 py-3 bg-stone-800 text-white text-sm font-medium hover:bg-stone-700 transition-colors">Subscribe</button>
 </form>
 </div>
</div>
