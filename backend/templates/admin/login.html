<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Admin | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 sm:p-0">
    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full">
        <h2 class="text-3xl font-extrabold text-slate-900 text-center mb-2">AURA<span class="text-indigo-600 font-light">Admin</span></h2>
        <p class="text-slate-500 text-center text-sm font-medium mb-8">Sign in to the superuser console</p>
        
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.errors %}
                <div class="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm font-bold border border-rose-200">Invalid username or password.</div>
            {% endif %}
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" required>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" required>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition-all transform hover:-translate-y-0.5 mt-4">
                Authenticate
            </button>
            <input type="hidden" name="next" value="{% url 'admin:dashboard' %}">
        </form>
    </div>
</body>
</html>
