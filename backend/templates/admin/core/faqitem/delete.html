{% extends "admin/admin_base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto text-center py-12">
 <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
 <i class="fa-solid fa-triangle-exclamation"></i>
 </div>
 <h1 class="text-3xl font-extrabold text-theme-text-primary mb-4">Delete FAQ Item?</h1>
 <p class="text-theme-text-muted text-lg mb-8">Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
 
 <form method="post" class="flex justify-center space-x-4">
 {% csrf_token %}
 <a href="{% url 'admin:faqitem_list' %}" class="px-6 py-3 border border-theme-border text-theme-text-muted font-bold rounded-xl hover:bg-theme-surface-hover transition">Cancel</a>
 <button type="submit" class="bg-rose-600 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-rose-700 transition">Yes, Delete</button>
 </form>
</div>
{% endblock %}
