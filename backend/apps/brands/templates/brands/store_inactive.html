{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand.name }} - Unavailable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="antialiased text-slate-900 dark:text-slate-50 bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col justify-center items-center">
    
    <div class="z-10 text-center px-6 max-w-lg mx-auto">
        <div class="mb-8 flex justify-center">
            <div class="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-store-slash text-3xl text-slate-400 dark:text-slate-500"></i>
            </div>
        </div>
        
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-50 mb-4">{{ brand.name }} is currently unavailable</h1>
        <p class="text-slate-500 dark:text-slate-400 text-lg leading-relaxed mb-8">
            This store is currently not active or accepting new orders. Please check back later.
        </p>
        
        <p class="mt-12 text-sm text-slate-400 dark:text-slate-500 font-medium tracking-wide uppercase">Powered by Aura</p>
    </div>
</body>
</html>
