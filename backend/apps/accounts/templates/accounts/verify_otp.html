{% extends "base.html" %}

{% block content %}
<div class="min-h-screen pt-32 pb-12 flex flex-col justify-center bg-slate-50 relative overflow-hidden">
    <div class="max-w-md w-full mx-auto flex bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 overflow-hidden relative z-10 border border-slate-100 p-10">
        <div class="w-full flex flex-col justify-center">
            <div class="mb-8 text-center">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl mx-auto flex items-center justify-center mb-6 border border-indigo-100">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Check your email</h2>
                <p class="mt-2 text-sm font-medium text-slate-500">
                    We sent a 6-digit verification code to <span class="font-bold text-slate-700">{{ email }}</span>.
                </p>
            </div>
            
            <form class="space-y-6" action="{% url 'verify_otp' %}" method="POST">
                {% csrf_token %}
                
                {% if messages %}
                <div class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 rounded-xl text-sm font-bold flex items-center mb-4">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
                {% endif %}

                <div>
                    <label for="otp_code" class="block text-sm font-bold text-slate-700 mb-2">6-Digit Code</label>
                    <input id="otp_code" name="otp_code" type="text" maxlength="6" required class="appearance-none block w-full px-4 py-4 text-center text-3xl tracking-[0.5em] bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-extrabold shadow-sm placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-600/20 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5">
                        Verify Code
                    </button>
                </div>
                
                <div class="text-center mt-6">
                    <a href="{% url 'forgot_password' %}" class="text-sm font-bold text-slate-500 hover:text-indigo-600">&larr; Use a different email</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
