{% extends "base.html" %}

{% block content %}
<div class="min-h-screen pt-32 pb-12 flex flex-col justify-center bg-slate-50 relative overflow-hidden">
    <div class="max-w-md w-full mx-auto flex bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 overflow-hidden relative z-10 border border-slate-100 p-10">
        <div class="w-full flex flex-col justify-center">
            <div class="mb-8 text-center">
                <div class="w-16 h-16 bg-emerald-50 rounded-2xl mx-auto flex items-center justify-center mb-6 border border-emerald-100">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create new password</h2>
                <p class="mt-2 text-sm font-medium text-slate-500">
                    Your identity has been verified. Please choose a strong password.
                </p>
            </div>
            
            <form class="space-y-6" action="{% url 'reset_password' %}" method="POST">
                {% csrf_token %}
                
                {% if messages %}
                <div class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 rounded-xl text-sm font-bold flex items-center mb-4">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
                {% endif %}

                <div>
                    <label for="password" class="block text-sm font-bold text-slate-700 mb-2">New Password</label>
                    <input id="password" name="password" type="password" required minlength="8" class="appearance-none block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-medium shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-bold text-slate-700 mb-2">Confirm Password</label>
                    <input id="confirm_password" name="confirm_password" type="password" required minlength="8" class="appearance-none block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-medium shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-emerald-600/20 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform hover:-translate-y-0.5">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
