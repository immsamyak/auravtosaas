{% extends "base.html" %}

{% block content %}
<div class="min-h-screen pt-32 pb-12 flex flex-col justify-center bg-theme-bg-base relative overflow-hidden">
 <div class="max-w-md w-full mx-auto flex bg-theme-bg-surface rounded-[2rem] shadow-2xl shadow-slate-200/50 overflow-hidden relative z-10 border border-theme-border-divider p-10">
 <div class="w-full flex flex-col justify-center">
 <div class="mb-8 text-center">
 <div class="w-16 h-16 bg-indigo-50 rounded-2xl mx-auto flex items-center justify-center mb-6 border border-indigo-100">
 <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
 </div>
 <h2 class="text-2xl font-extrabold text-theme-text-base tracking-tight">Forgot Password</h2>
 <p class="mt-2 text-sm font-medium text-theme-text-muted">
 Enter your email address and we'll send you a 6-digit verification code.
 </p>
 </div>
 
 <form class="space-y-6" action="{% url 'forgot_password' %}" method="POST">
 {% csrf_token %}
 
 <div>
 <label for="email" class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
 <input id="email" name="email" type="email" required class="appearance-none block w-full px-4 py-3 bg-theme-bg-base border border-theme-border-base rounded-xl text-theme-text-base font-medium shadow-sm placeholder-theme-input-placeholder focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all sm:text-sm">
 </div>

 <div class="pt-2">
 <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-600/20 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5">
 Send Verification Code
 </button>
 </div>
 
 <div class="text-center mt-6">
 <a href="{% url 'login' %}" class="text-sm font-bold text-theme-text-muted hover:text-indigo-600">&larr; Back to login</a>
 </div>
 </form>
 </div>
 </div>
</div>
{% endblock %}
